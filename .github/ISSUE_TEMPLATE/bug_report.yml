name: Bug report
description: Something renders, behaves, or builds wrong.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For an accessibility problem, use the Accessibility issue form instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you were doing when it happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Render <Button variant="…">
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: From your lockfile or `package.json`. Use the commit SHA if you are on `main`.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (say which below)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A StackBlitz or CodeSandbox link, or the smallest code that shows the problem.
      render: tsx
    validations:
      required: false
  - type: checkboxes
    id: search
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this.
          required: true
